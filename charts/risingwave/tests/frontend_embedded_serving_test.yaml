suite: Test Embedded Frontend Serving
templates:
- frontend-deploy.yaml
- compute-sts.yaml
chart:
  appVersion: 1.0.0
  version: 0.0.1
set:
  frontendComponent:
    embeddedServing: true
tests:
- it: command should be standalone
  template: frontend-deploy.yaml
  asserts:
  - equal:
      path: spec.template.spec.containers[0].command
      value:
      - /risingwave/bin/risingwave
      - standalone
- it: readiness probe should check both frontend and compute listeners
  template: frontend-deploy.yaml
  asserts:
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
      value: 2
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.periodSeconds
      value: 10
  - notExists:
      path: spec.template.spec.containers[0].readinessProbe.tcpSocket
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.exec.command
      value:
      - bash
      - -ec
      - |-
        </dev/tcp/127.0.0.1/4567
        </dev/tcp/127.0.0.1/5688
- it: standard frontend readiness probe should remain unchanged
  template: frontend-deploy.yaml
  set:
    frontendComponent:
      embeddedServing: false
  asserts:
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
      value: 2
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.periodSeconds
      value: 10
  - notExists:
      path: spec.template.spec.containers[0].readinessProbe.exec
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
      value: svc
- it: should have pre-stop lifecycle hook when auto deregistration is enabled
  template: frontend-deploy.yaml
  set:
    frontendComponent:
      autoDeregistration:
          enabled: true
  asserts:
  - exists:
      path: spec.template.spec.containers[0].lifecycle.preStop
  - equal:
      path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
      value:
      - bash
      - -c
      - >-
        /risingwave/bin/risingwave ctl meta unregister-workers --yes \
          --workers ${POD_IP}:5688
- it: shouldn't have pre-stop lifecycle hook when auto deregistration is disabled
  template: frontend-deploy.yaml
  set:
    frontendComponent:
      autoDeregistration:
          enabled: false
  asserts:
  - notExists:
      path: spec.template.spec.containers[0].lifecycle
- it: compute node should set role to streaming
  template: compute-sts.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content:
        --role=streaming
